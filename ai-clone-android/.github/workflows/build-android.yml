name: Build Android Accessibility Service

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x ai-clone-android/gradlew

    - name: Build Debug APK
      run: |
        cd ai-clone-android
        ./gradlew assembleDebug

    - name: Build Release APK
      run: |
        cd ai-clone-android
        ./gradlew assembleRelease

    - name: Upload Debug APK
      uses: actions/upload-artifact@v3
      with:
        name: ai-seq-clone-debug
        path: ai-clone-android/app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Release APK
      uses: actions/upload-artifact@v3
      with:
        name: ai-seq-clone-release
        path: ai-clone-android/app/build/outputs/apk/release/app-release.apk

    - name: Download APK
      run: |
        cd ai-clone-android/app/build/outputs/apk/release
        ls -lh app-release.apk

    - name: Create Magisk Module
      run: |
        mkdir -p magisk_module/system/priv-app
        cp ai-clone-android/app/build/outputs/apk/release/app-release.apk magisk_module/system/priv-app/AISeqClone.apk
        cp magisk_module/module.prop magisk_module/updated-module.prop

    - name: Create Module ZIP
      run: |
        cd magisk_module
        zip -r ../ai-seq-clone-magisk.zip .
        cd ..

    - name: Upload Magisk Module
      uses: actions/upload-artifact@v3
      with:
        name: ai-seq-clone-magisk
        path: ai-seq-clone-magisk.zip
